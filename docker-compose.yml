services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cult
      POSTGRES_PASSWORD: cult
      POSTGRES_DB: cult
    ports: ["5432:5432"]
    volumes: ["cult_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cult"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["live-shadow"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    # db:seed populates the `expressions` reference table that
    # expression_observations_v3.expression_id has a foreign-key constraint
    # against. Migrations alone leave it empty -- every worker write failed
    # with a foreign-key violation until seeding ran, discovered running
    # this profile's first real live-shadow session. Both scripts are
    # idempotent (ON CONFLICT upserts), safe to rerun.
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    environment:
      DATABASE_URL: postgresql://cult:cult@postgres:5432/cult
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bluesky-worker:
    profiles: ["live-shadow"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["npm", "run", "worker"]
    environment:
      CULT_DATA_MODE: live-shadow
      DATABASE_URL: postgresql://cult:cult@postgres:5432/cult
      BLUESKY_JETSTREAM_URL: ${BLUESKY_JETSTREAM_URL:-wss://jetstream2.us-east.bsky.network/subscribe}
      # No fallback value: attribution.ts now refuses to start a durable
      # (DATABASE_URL-configured) deployment without a real secret rather
      # than silently degrading to a random per-process key. A committed,
      # publicly-known default here would let anyone compute the same HMAC
      # key and de-anonymize every record_id/cascade_root_id this profile
      # ever produces -- set CULT_CASCADE_HASH_SECRET in .env before running
      # `docker compose --profile live-shadow up`.
      CULT_CASCADE_HASH_SECRET: ${CULT_CASCADE_HASH_SECRET:?set CULT_CASCADE_HASH_SECRET in .env before running live-shadow}
      CULT_REPLAY_PATH: data/runtime/replays/bluesky.jsonl
      CULT_BEHAVIOR_TAPE_PATH: data/runtime/replays/expression-events.jsonl
      CULT_CHECKPOINT_PATH: data/runtime/checkpoints/bluesky.json
    volumes:
      - cult_live_data:/app/data/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  cult_postgres:
  cult_live_data:
